<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Frontend Mentor | Intro section with dropdown navigation</title>


</head>

<body class="flex justify-center items-center lg:bg-white bg-white ">
  <div class="container flex overflow-hidden flex-col ">
    <div class="header p-6 flex justify-between w-full">
      <img src="./images/logo.svg" class="w-20 lg:hidden">
      <div class="left-text hidden lg:flex gap-4 items-center">
        <img src="./images/logo.svg" class="w-20">
        <span class="ml-5">Features</span>
        <span>Company</span>
        <span>Careers</span>
        <span>About</span>
      </div>
      <div class="media flex p-3">
        <div class="block lg:hidden w-6 cursor-pointer">
          <img src="./images/icon-menu.svg" class="w-[200px]">
        </div>
      </div>
      <div class="right-button hidden lg:!block">
        <span class="w-1 p-2">Login</span>
        <button class="ml-6 p-2 w-[100px] border-2 border-black rounded-xl">Register</button>
      </div>
    </div>
    <div class="general flex flex-col lg:flex-row">

      <div class="left px-6 lg:px-20 lg:mt-[100px] text-center lg:text-left">

        <img src="images/image-hero-mobile.png" class="block md:hidden w-full mb-6">

        <h1 class="font-bold text-3xl lg:text-6xl">
          Make <br>remote work
        </h1>

        <p class="mt-6">
          Get your team in sync, no matter your <br>location.
          Streamline processes, create <br>team rituals,
          and watch productivity soar.
        </p>

        <button class="mt-6 bg-black text-white p-2 w-[120px] rounded-lg">
          Learn more
        </button>

        <div class="flex justify-center lg:justify-start gap-6 mt-[50px]">
          <img src="images/client-databiz.svg" class="w-20">
          <img src="images/client-audiophile.svg" class="w-16">
          <img src="images/client-meet.svg" class="w-20">
          <img src="images/client-maker.svg" class="w-20">
        </div>
      </div>

      <div class="right hidden lg:flex justify-center items-center mt-[80px] ml-[300px]">
        <img src="./images/image-hero-desktop.png" class="w-[350px]">
      </div>

    </div>
  </div>
</body>

</html>
